<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Visualização de imagem em tela cheia">
  <div class="lightbox__backdrop" data-lightbox-close></div>

  <div class="lightbox__topbar">
    <div class="lightbox__counter" aria-live="polite">
      <span data-lightbox-current>1</span> / <span data-lightbox-total>1</span>
    </div>
    <button type="button" class="lightbox__close" data-lightbox-close aria-label="Fechar galeria (Esc)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <button type="button" class="lightbox__nav lightbox__nav--prev" data-lightbox-prev aria-label="Foto anterior">
    <svg width="44" height="16" viewBox="0 0 44 16" fill="none" aria-hidden="true">
      <line x1="43" y1="8" x2="2" y2="8" stroke="currentColor" stroke-width="1.2"/>
      <polyline points="9,1 1.5,8 9,15" fill="none" stroke="currentColor" stroke-width="1.2"/>
    </svg>
  </button>

  <div class="lightbox__stage">
    <img class="lightbox__image" data-lightbox-image src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
  </div>

  <button type="button" class="lightbox__nav lightbox__nav--next" data-lightbox-next aria-label="Próxima foto">
    <svg width="44" height="16" viewBox="0 0 44 16" fill="none" aria-hidden="true">
      <line x1="1" y1="8" x2="42" y2="8" stroke="currentColor" stroke-width="1.2"/>
      <polyline points="35,1 42.5,8 35,15" fill="none" stroke="currentColor" stroke-width="1.2"/>
    </svg>
  </button>
</div>
