frase: '"Acreditamos em eternizar histórias e momentos que vão durar para sempre"'
frase_secundaria: '"Registrar bem cada instante é transformar sentimentos em
  memórias atemporais."'
sobre_titulo: Conheça MATEUS
sobre_texto: Comecei na fotografia por curiosidade e paixão pela arte de
  observar. Com esforço e economia do meu trabalho na feira do bosque,
  conquistei minha câmera Canon e, no segundo semestre de 2023, passei a atuar
  profissionalmente registrando momentos únicos.
sobre_foto: /media/about-pic.jpg
sobre_destaque: '"Olhar sensível, direção leve e autenticidade em cada clique —
  unindo fotografia, design e dedicação aos detalhes..."'
sobre_botao: Saiba Mais
depoimentos_titulo: O Que Dizem
depoimentos_subtitulo: A maior alegria do nosso trabalho vem das palavras
  sinceras de quem confiou em nosso olhar para eternizar momentos tão
  importantes.
processo_titulo: O Processo
processo_subtitulo: Da nossa primeira conversa até a entrega da galeria final,
  cada etapa é pensada para que sua experiência fotográfica seja leve,
  organizada e inesquecível.
processo_etapas:
  - numero: "01."
    titulo: Conversa Inicial
    texto: Conversamos sobre a sua ideia, estilo de ensaio ou evento, referências e
      expectativas para planejarmos juntos cada detalhe especial.
  - numero: "02."
    titulo: Planejamento & Direção
    texto: Definimos locação, melhor horário de luz, figurinos e roteiro para que
      tudo flua com tranquilidade e naturalidade no grande dia.
  - numero: "03."
    titulo: O Dia das Fotos
    texto: Cobertura dedicada e condução leve, capturando tanto os retratos
      planejados quanto os momentos espontâneos com olhar artístico.
  - numero: "04."
    titulo: Curadoria & Entrega
    texto: Seleção cuidadosa e tratamento de cor autoral, entregues em alta
      resolução para você reviver e compartilhar suas memórias.
cta_titulo: Vamos registrar a sua história
cta_texto: Se você tem um momento especial para viver e recordar, será uma honra
  contá-lo através das minhas lentes. Entre em contato e vamos criar juntos.
cta_botao: Agendar um Ensaio
cta_imagem: /media/header-banner.jpg
