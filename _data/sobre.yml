titulo: Conheça Mateus Machado, fotógrafo apaixonado por capturar a essência de
  momentos reais através de suas lentes.
foto: /media/about-pic.jpg
bio_texto: Comecei na fotografia como um hobby, movido pelo lazer e pela
  curiosidade de explorar essa arte.Quando comprei minha câmera digital da Canon
  na segunda metade de 2023, iniciei minha trajetória com trabalhos
  profissionais, descobrindo na fotografia uma forma de unir propósito,
  sensibilidade e dedicação constante. Atuo cultivando um olhar estético
  versátil que caminha junto beleza de registrar momentos únicos.
