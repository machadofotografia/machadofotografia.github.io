titulo: "Conheça Mateus Machado, fotógrafo e designer apaixonado por capturar a essência de momentos reais através de suas lentes."
foto: "/media/about-pic.jpg"
bio_intro: "Mateus Machado transforma instantes cotidianos e celebrações marcantes em imagens autênticas, cheias de luz, naturalidade e emoção."
bio_texto: "Comecei na fotografia como um hobby, movido pelo lazer e pela curiosidade de explorar essa arte. Consegui comprar minha câmera digital Canon com o dinheiro que havia economizado e com o fruto do meu trabalho na feira do bosque.\n\nNa segunda metade de 2023, iniciei minha trajetória com trabalhos profissionais, descobrindo na fotografia uma forma de unir propósito, sensibilidade e dedicação constante. Também atuo na área de design, cultivando um olhar estético versátil que caminha junto à minha formação como estudante de Odontologia."
